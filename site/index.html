<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz SNCT: As calculadoras da NASA</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">

    <!-- Tela 1: início -->
    <section id="tela-inicio" class="tela ativa">
      <p class="rotulo">Quiz SNCT</p>
      <h1>Quem eram as calculadoras da NASA?</h1>
      <p class="sub">5 perguntas · 10 segundos cada</p>
      <label for="apelido">Seu apelido</label>
      <input id="apelido" maxlength="15" placeholder="Ex.: Ada" autocomplete="off">
      <button id="btn-comecar" class="btn">Começar</button>
      <p id="erro-inicio" class="erro" role="alert"></p>
    </section>

    <!-- Tela 2: quiz -->
    <section id="tela-quiz" class="tela">
      <div class="topo">
        <span id="contador"></span>
        <span id="ganho" class="ganho"></span>
        <span id="total"></span>
      </div>
      <div class="barra"><div id="barra-tempo"></div></div>
      <h2 id="pergunta"></h2>
      <div id="opcoes"></div>
      <div id="transicao" class="transicao oculto">
        <p class="rotulo">Você sabia?</p>
        <p id="curiosidade"></p>
      </div>
    </section>

    <!-- Tela 3: fim -->
    <section id="tela-fim" class="tela">
      <p class="rotulo">Fim de jogo</p>
      <p class="sub">Sua pontuação</p>
      <div id="pontuacao-final" class="grande">0</div>
      <p id="titulo-final" class="titulo"></p>
      <p id="status-envio" class="status"></p>
      <h3>Conheça as três</h3>
      <div id="fichas" class="fichas"></div>
    </section>

  </main>

  <!-- Firebase (SDK compat) e configuração -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="config.js"></script>
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
